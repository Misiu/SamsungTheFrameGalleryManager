name: Release

# Manual release. Run it from the Actions tab and give the tag (for example v0.1.0).
# The tag must match the version in Directory.Build.props. The workflow tests and publishes the app,
# creates the tag and a GitHub release, and attaches the ready-to-run zip with its SHA-256 checksum.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, must match the version in Directory.Build.props (for example v0.1.0)"
        required: true
        type: string

# Needed to create the tag and the release.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Releases are made from main only.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Check the tag
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}   # passed through the environment, never pasted into the script
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "The tag '$env:TAG' must look like v1.2.3." }
          $tagVersion = $Matches[1]

          $version = (dotnet msbuild src/FrameGallery.App -getProperty:Version -nologo).Trim()
          if ($version -ne $tagVersion) { throw "The tag $env:TAG does not match the version $version in Directory.Build.props." }

          $existing = git ls-remote --tags origin "refs/tags/$env:TAG"
          if ($existing) { throw "The tag $env:TAG already exists." }

          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test tests/FrameGallery.Tests --configuration Release --nologo

      - name: Publish
        run: dotnet publish src/FrameGallery.App --configuration Release --output publish/FrameGallery --nologo

      - name: Package
        shell: pwsh
        run: |
          $zip = "FrameGallery-$env:VERSION-win.zip"
          Compress-Archive -Path publish/FrameGallery/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Encoding ascii "$zip.sha256"
          "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Create the tag and the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create $env:TAG $env:ZIP "$env:ZIP.sha256" `
            --target $env:GITHUB_SHA `
            --title "Frame Gallery $env:TAG" `
            --generate-notes
